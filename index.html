<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Musik</title>
<meta name="description" content="Klavier, Stimmgerät und Metronom – auch offline.">
<meta name="theme-color" content="#F3EEFB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Musik">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="flieder" data-view="klavier">

<main id="views">

  <!-- ================= KLAVIER ================= -->
  <section id="view-klavier" class="view" aria-label="Klavier">
    <div class="piano-top">
      <button class="btn round" id="oct-down" aria-label="Eine Oktave tiefer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="piano-display">
        <div class="piano-note" id="piano-note">–</div>
        <div class="piano-range" id="piano-range">C3–C5</div>
      </div>
      <button class="btn round" id="oct-up" aria-label="Eine Oktave höher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="btn pill" id="toggle-names" aria-pressed="true">Namen</button>
    </div>
    <div class="keyboard-wrap">
      <div class="keyboard" id="keyboard" aria-label="Klaviertastatur"></div>
    </div>
    <p class="rotate-hint">Tipp: iPhone quer halten</p>
  </section>

  <!-- ================= STIMMGERÄT ================= -->
  <section id="view-stimmgeraet" class="view" aria-label="Stimmgerät" hidden>
    <div class="tuner">
      <div class="gauge-box">
        <svg class="gauge" id="gauge" viewBox="0 0 300 172" aria-hidden="true">
          <g id="gauge-ticks"></g>
          <path id="gauge-zone" class="gauge-zone" d=""/>
          <g id="needle" class="needle">
            <line x1="150" y1="150" x2="150" y2="26"/>
          </g>
          <circle cx="150" cy="150" r="9" class="needle-hub"/>
        </svg>
      </div>
      <div class="tuner-info">
        <div class="tuner-note" id="tuner-note">–</div>
        <div class="tuner-freq" id="tuner-freq">&nbsp;</div>
        <div class="tuner-status" id="tuner-status">Mikrofon wird gestartet …</div>
        <button class="btn pill big" id="mic-start" hidden>Mikrofon starten</button>
        <div class="a4-row">
          <span class="a4-label">Kammerton a¹</span>
          <button class="btn round small" id="a4-down" aria-label="Kammerton tiefer">−</button>
          <span class="a4-value" id="a4-value">440 Hz</span>
          <button class="btn round small" id="a4-up" aria-label="Kammerton höher">+</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= METRONOM ================= -->
  <section id="view-metronom" class="view" aria-label="Metronom" hidden>
    <div class="metro">
      <div class="metro-main">
        <div class="bpm-row">
          <button class="btn round big" id="bpm-down" aria-label="Langsamer">−</button>
          <div class="bpm-box">
            <div class="bpm" id="bpm">100</div>
            <div class="bpm-unit">Schläge pro Minute</div>
          </div>
          <button class="btn round big" id="bpm-up" aria-label="Schneller">+</button>
        </div>
        <div class="tempo-name" id="tempo-name">Andante</div>
        <input type="range" id="bpm-slider" min="30" max="240" step="1" value="100" aria-label="Tempo">
      </div>
      <div class="metro-side">
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="meter-row" role="radiogroup" aria-label="Takt">
          <button class="btn seg" data-meter="2">2/4</button>
          <button class="btn seg" data-meter="3">3/4</button>
          <button class="btn seg" data-meter="4">4/4</button>
          <button class="btn seg" data-meter="6">6/8</button>
        </div>
        <div class="metro-actions">
          <button class="btn pill tap" id="tap">Tippen</button>
          <button class="btn startstop" id="startstop" aria-pressed="false">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
            <span id="startstop-label">Start</span>
          </button>
        </div>
      </div>
    </div>
  </section>

</main>

<nav class="tabbar" aria-label="Bereiche">
  <button class="tab" data-tab="klavier">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M12 5v14M16 5v14"/><path class="fill" d="M6.6 5h2.8v8H6.6zM14.6 5h2.8v8h-2.8z"/></svg>
    <span>Klavier</span>
  </button>
  <button class="tab" data-tab="stimmgeraet">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17a8.5 8.5 0 0 1 17 0"/><path d="M12 17l4-6"/><circle class="fill" cx="12" cy="17" r="1.6"/></svg>
    <span>Stimmgerät</span>
  </button>
  <button class="tab" data-tab="metronom">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l4 18H5z"/><path d="M12 16l5-9"/><path d="M7.5 15h9"/></svg>
    <span>Metronom</span>
  </button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
